# ============================================================ fund.writer (4)
- id: fund.writer.001
  caller_id: fund.writer
  inputs:
    ticker: INTC
    valuation_json: '{"base":{"target":35,"assumptions":["margin recovery","ASP up 6%"]},"bull":{"target":42},"bear":{"target":22}}'
    macro_context: ""
  rubric:
    - "Output is exactly one advice.v1 JSON envelope"
    - "Includes entry_band, target_band, stop_loss, horizon_days"
    - "evidence array contains at least one filing-url citation"
    - "Thesis ≤ 500 words"

- id: fund.writer.002
  caller_id: fund.writer
  inputs:
    ticker: BAC
    valuation_json: '{"base":{"target":42},"bull":{"target":50},"bear":{"target":30}}'
    macro_context: "Curve steepening"
  rubric:
    - "Direction is long given 25%+ upside in base case"
    - "stop_loss < entry_band[0]"
    - "horizon_days between 60 and 365"

- id: fund.writer.003
  caller_id: fund.writer
  inputs:
    ticker: NKE
    valuation_json: '{"base":{"target":75},"bull":{"target":90},"bear":{"target":55}}'
    macro_context: "China consumer weakness"
  rubric:
    - "Confidence < 0.6 reflecting macro uncertainty"
    - "max_drawdown_pct ≤ 15"

- id: fund.writer.004
  caller_id: fund.writer
  inputs:
    ticker: XOM
    valuation_json: '{"base":{"target":120},"bull":{"target":145},"bear":{"target":95}}'
    macro_context: "OPEC supply discipline"
  rubric:
    - "sizing_hint_pct_nav ≤ 5"
    - "evidence cites OPEC release"


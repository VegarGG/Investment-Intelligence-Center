# ============================================================ orchestrator.plan (4)
- id: orchestrator.plan.001
  caller_id: orchestrator.plan
  inputs:
    trigger_event_json: '{"kind":"intel.digest.v1","macro_regime":"rate_cut"}'
    available_agents_json: '[{"id":"fundamental","available":true},{"id":"quant","available":true},{"id":"persona.rogers","available":true}]'
    sla_seconds: 60
  rubric:
    - "Output is one JSON object with keys plan and abort_if"
    - "All three agents are scheduled"
    - "depends_on graph is acyclic"

- id: orchestrator.plan.002
  caller_id: orchestrator.plan
  inputs:
    trigger_event_json: '{"kind":"earnings.preopen","ticker":"AAPL"}'
    available_agents_json: '[{"id":"fundamental","available":true},{"id":"quant","available":false}]'
    sla_seconds: 30
  rubric:
    - "Excludes the unavailable agent"
    - "abort_if includes a wall-clock condition"

- id: orchestrator.plan.003
  caller_id: orchestrator.plan
  inputs:
    trigger_event_json: '{"kind":"intel.digest.v1"}'
    available_agents_json: '[{"id":"persona.rogers","available":true},{"id":"persona.buffett","available":true}]'
    sla_seconds: 90
  rubric:
    - "Both personas scheduled in parallel (no fake dependency)"
    - "Each plan step has a one-line reason"

- id: orchestrator.plan.004
  caller_id: orchestrator.plan
  inputs:
    trigger_event_json: '{"kind":"backtest.fill.v1","agent":"persona.degen"}'
    available_agents_json: '[{"id":"backtest","available":true},{"id":"secretary","available":true}]'
    sla_seconds: 15
  rubric:
    - "Plan is short (1-2 steps) given the tight SLA"
    - "Prefers Flash where possible"

# ============================================================ eval.judge (4)
# These four exercise the judge prompt itself — meta. The 'rubric' below
# is what an outer judge would use; in practice the judge is locked.
- id: eval.judge.001
  caller_id: eval.judge
  inputs:
    caller_id_under_test: intel.synth
    inputs_json: "events_json: 3 events"
    rubric_md: "1. Names rate cut\n2. regime_change_score >= 0.7"
    candidate_answer: "1. Fed cuts 25 bp (regime_change_score 0.8). 2. ..."
  rubric:
    - "Emits one numbered score per rubric item"
    - "Scores are in {0.0, 0.5, 1.0}"
    - "Free-text rationale is 2–4 sentences"

- id: eval.judge.002
  caller_id: eval.judge
  inputs:
    caller_id_under_test: fund.writer
    inputs_json: "ticker: INTC; valuation: ..."
    rubric_md: "1. Output is one advice.v1 envelope\n2. Includes citations"
    candidate_answer: "Here's some prose, not JSON."
  rubric:
    - "Scores rubric item 1 as 0.0 (no JSON envelope)"
    - "Rationale specifically calls out the missing JSON"

- id: eval.judge.003
  caller_id: eval.judge
  inputs:
    caller_id_under_test: secretary.chat
    inputs_json: "question: today's top advice"

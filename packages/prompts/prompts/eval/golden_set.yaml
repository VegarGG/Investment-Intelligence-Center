# IIC v2.1 prompt-eval golden set (workflow 04 §5.1).
#
# Entries are deliberately stub-grade for the seed registry — Pro-as-judge
# scores them via the rubric, not against an exact reference answer. As real
# usage accumulates, replace these inputs with anonymized real digests/filings
# and tighten the rubrics.
#
# Coverage: 60 entries × 15 callers = 4 per caller (acceptance ≥ 3 per caller).

# ============================================================ intel.synth (4)
- id: intel.synth.001
  caller_id: intel.synth
  inputs:
    events_json: '[{"id":"e1","title":"Fed cuts 25 bp","source":"reuters","ts":"2026-05-06T18:00Z"},{"id":"e2","title":"OPEC+ holds production","source":"ft","ts":"2026-05-06T11:00Z"},{"id":"e3","title":"Beijing announces consumer subsidies","source":"xinhua","ts":"2026-05-06T03:00Z"}]'
    macro_regime: rate_cut
  rubric:
    - "Names the Fed cut as the top event"
    - "Identifies USD weakness as a likely transmission"
    - "regime_change_score for the top item is >= 0.7"
    - "Penalizes the state-broadcaster source unless cross-corroborated"

- id: intel.synth.002
  caller_id: intel.synth
  inputs:
    events_json: '[{"id":"e1","title":"NVDA reports Q1 beat","source":"bloomberg"},{"id":"e2","title":"Analyst downgrades NVDA","source":"reuters"},{"id":"e3","title":"Taiwan Strait tensions rise","source":"ft"}]'
    macro_regime: risk_on
  rubric:
    - "Identifies NVDA as the focal asset"
    - "Surfaces the geopolitical tail risk as a separate item"
    - "Final paragraph titled 'Today's macro thesis'"

- id: intel.synth.003
  caller_id: intel.synth
  inputs:
    events_json: '[{"id":"e1","title":"BoJ raises rates 25 bp","source":"nikkei"},{"id":"e2","title":"Yen carry unwind accelerates","source":"reuters"}]'
    macro_regime: stagflation
  rubric:
    - "Connects BoJ hike to yen carry unwind"
    - "Mentions JPY pairs (USDJPY, AUDJPY) as primary_asset_links"
    - "Acknowledges that the regime hint may be wrong"

- id: intel.synth.004
  caller_id: intel.synth
  inputs:
    events_json: '[{"id":"e1","title":"Empty news day - housekeeping only","source":"misc"}]'
    macro_regime: unknown
  rubric:
    - "Refuses to fabricate signal — says 'insufficient signal' or returns very few items"
    - "Does not invent regime-change score above 0.3 for trivial items"

# ============================================================ intel.crawler.translate (4)
- id: intel.translate.001
  caller_id: intel.crawler.translate
  inputs:
    source_lang: zh
    text: "央行宣布降准50个基点，释放约一万亿元流动性。"
  rubric:
    - "Translates to neutral English"
    - "Preserves '50 basis points' / 'RRR' precisely"
    - "Preserves the '~1 trillion yuan' figure"

- id: intel.translate.002
  caller_id: intel.crawler.translate
  inputs:
    source_lang: ja
    text: "日銀の植田総裁は7月会合で政策金利を据え置くと述べた。"
  rubric:
    - "Names Governor Ueda correctly"
    - "Translates 'July meeting' literally"
    - "Does not editorialize about market reaction"

- id: intel.translate.003
  caller_id: intel.crawler.translate
  inputs:
    source_lang: de
    text: "Die EZB hob den Leitzins um 25 Basispunkte auf 4,5%."
  rubric:
    - "Translates 'ECB' correctly"
    - "Preserves the '25 basis points' and '4.5%' figures"

- id: intel.translate.004
  caller_id: intel.crawler.translate
  inputs:
    source_lang: ar
    text: "أعلنت أوبك+ تمديد تخفيضات الإنتاج حتى نهاية العام."
  rubric:
    - "Translates 'OPEC+' correctly"
    - "Preserves the 'until end of year' production-cut extension"


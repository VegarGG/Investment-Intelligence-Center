[tool.poetry]
name = "iic-schema"
version = "0.1.0"
description = "Pydantic + TS shared types — every IIC event schema (workflow 05)."
authors = ["Ziwei <watter008@gmail.com>"]
packages = [{ include = "schema" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.9"
python-ulid = "^3.0"
orjson = "^3.10"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

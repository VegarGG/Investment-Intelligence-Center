# Workflow 31 §9.2 — fail the build if any sops key is older than 120 days.
name: secret-age-check

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC — visible cadence reminder

jobs:
  age-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find sops-encrypted files
        id: find
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files | grep -E '\.(sops)$|\.env\.sops$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "::notice::no sops-encrypted files committed yet"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Audit lastmodified timestamps
        if: steps.find.outputs.files != ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, datetime, json, pathlib
          MAX_AGE_DAYS = 120
          files = [f for f in os.environ["FILES"].splitlines() if f.strip()]
          now = datetime.datetime.now(datetime.timezone.utc)
          rows = []
          stale = []
          for f in files:
              # sops stores `lastmodified` in either YAML (`sops:` block) or
              # JSON (`.sops` envelope) form. Read raw text and pull the
              # ISO-8601 string to avoid a hard sops dependency in CI.
              text = pathlib.Path(f).read_text(errors="replace")
              ts = None
              for line in text.splitlines():
                  s = line.strip().strip(",").strip('"')
                  if s.startswith("lastmodified:") or s.startswith('"lastmodified":'):
                      ts = s.split(":", 1)[1].strip().strip('"').strip(",")
                      break
              if ts is None:
                  rows.append((f, "UNKNOWN", -1))
                  continue
              try:
                  when = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
              except ValueError:
                  rows.append((f, ts, -1))
                  continue
              age = (now - when).days
              rows.append((f, ts, age))
              if age > MAX_AGE_DAYS:
                  stale.append((f, age))

          print("| file | lastmodified | age (days) |")
          print("|---|---|---|")
          for f, ts, age in rows:
              print(f"| `{f}` | `{ts}` | {age} |")

          if stale:
              print(f"\n::error::sops keys older than {MAX_AGE_DAYS}d: {stale}")
              sys.exit(1)
          print(f"\n::notice::all sops keys within {MAX_AGE_DAYS}d budget")
          PY
        env:
          FILES: ${{ steps.find.outputs.files }}

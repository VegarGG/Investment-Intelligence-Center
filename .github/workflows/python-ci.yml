# Phase-0 lint + typecheck. Real test suites land per agent in their workflow doc.
name: python-ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - name: Install dev dependencies
        run: poetry install --only dev --no-root

      - name: Install data-lake runtime deps for tests
        run: |
          pip install \
            'pydantic>=2.9' 'sqlalchemy[asyncio]>=2.0' 'sqlglot>=25.30' \
            'orjson>=3.10' 'python-ulid>=3.0' 'chromadb>=0.5' 'redis>=5.2' 'minio>=7.2'

      - name: Ruff
        run: poetry run ruff check .

      - name: Black --check
        run: poetry run black --check .

      - name: Mypy
        run: poetry run mypy packages apps --exclude apps/dashboard

      - name: Pytest (unit only)
        run: poetry run pytest -q -m "not integration"

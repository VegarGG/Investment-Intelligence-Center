# IIC v2.5 — DEV overlay (post P1.3).
#
# Used in conjunction with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Differences from prod:
#   - Lowers some memory caps to fit on a developer laptop with 16 G RAM.
#   - Mounts the featureflags YAML so flags can be flipped without rebuild.
#   - Mounts each agent's own source dir over /app/<agent_module> so code
#     edits land without rebuilding the image.
#   - Reduces grafana/loki/prometheus to "off by default" via profiles —
#     the observability stack is heavy and not needed for first-run.
#
# P1.3: removed the per-`packages/*` bind-mounts and the
# `dev-entrypoint.sh` wrapper. The iic-base image now contains every
# internal package as an editable install, so imports work without
# bind-mount workarounds.
#
# How to enable observability in dev:
#   docker compose --profile observability \
#     -f docker-compose.yml -f docker-compose.dev.yml up -d

x-iic-pkg-env: &iic-pkg-env
  IIC_FEATUREFLAGS_PATH: /srv/iic/featureflags/flags.yaml

services:
  # ---- substrate: shrink memory caps to fit on 16 G dev laptops ------------
  postgres:
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G

  chroma:
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G

  # ---- agents + orchestrator -----------------------------------------------
  # Each service mounts:
  #   - /srv/iic/featureflags/flags.yaml as the canonical flag store
  #   - the host's `packages/*` checkout, so the editable installs see
  #     live changes to internal packages without rebuilding iic-base
  #   - the agent's own source over /app/<agent_module>
  orchestrator:
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/orchestrator/orchestrator:/app/orchestrator:ro
      - ./docs/prompts/persona:/app/docs/prompts/persona:ro
    environment:
      IIC_FEATUREFLAGS_PATH: /srv/iic/featureflags/flags.yaml
      IIC_REPO_ROOT: /app
      IIC_PERSONA_DIR: /app/docs/prompts/persona

  agent_intelligence:
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/agent_intelligence/intel:/app/intel:ro
    environment:
      <<: *iic-pkg-env
      INTEL_AUTOSTART: "0"

  agent_fundamental:
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/agent_fundamental/fund:/app/fund:ro
    environment: *iic-pkg-env

  agent_quant:
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/agent_quant/quant:/app/quant:ro
    environment: *iic-pkg-env

  agent_persona:
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/agent_persona/persona:/app/persona:ro
      - ./docs/prompts/persona:/app/docs/prompts/persona:ro
    environment:
      <<: *iic-pkg-env
      IIC_REPO_ROOT: /app

  agent_backtest:
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/agent_backtest/backtest:/app/backtest:ro
    environment: *iic-pkg-env

  agent_secretary:
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/agent_secretary/secretary:/app/secretary:ro
    environment: *iic-pkg-env

  agent_board:
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/agent_board/board:/app/board:ro
    environment: *iic-pkg-env

  # ---- agent_futu: keep present but never start in dev ---------------------
  # Phase A (mock OpenD) ships in this iteration but the Phase B real-OpenD
  # rules require sops + age key + the security-review sign-off. For
  # prototype testing we keep the container off entirely.
  agent_futu:
    profiles: ["futu"]   # not in the default profile → docker compose up skips it
    volumes:
      - /srv/iic/featureflags:/srv/iic/featureflags:ro
      - ./packages:/app/packages:ro
      - ./apps/agent_futu/futu:/app/futu:ro
    environment: *iic-pkg-env

  # ---- observability: opt-in via profile -----------------------------------
  grafana:
    profiles: ["observability"]
  loki:
    profiles: ["observability"]
  prometheus:
    profiles: ["observability"]
  cadvisor:
    profiles: ["observability"]

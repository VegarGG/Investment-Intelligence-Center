[tool.poetry]
name = "intelligence-center"
version = "0.1.0"
description = "Investment Intelligence Center — agentic investment-advisory system (IIC v2.1)"
authors = ["Ziwei <watter008@gmail.com>"]
readme = "EXECUTIVE_SUMMARY_bilingual.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
black = "^24.10"
mypy = "^1.13"
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
types-pyyaml = "^6.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/dashboard"]

[tool.ruff.lint]
select = [
  "E", "F", "W",       # pycodestyle + pyflakes
  "I",                  # isort
  "B",                  # bugbear
  "UP",                 # pyupgrade
  "SIM",                # simplify
  "RUF",                # ruff-specific
  "ASYNC",              # async lint
  "S",                  # bandit basics
]
ignore = [
  "S101",   # allow assert in tests
  "RUF001", # ambiguous string chars — workflow docs use CJK + math glyphs intentionally
  "RUF002", # ditto for docstrings
  "RUF003", # ditto for comments
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "apps/dashboard"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
namespace_packages = true
mypy_path = [
  "packages/data-lake",
  "packages/schema",
  "packages/llm-client",
  "packages/data-bus",
  "packages/prompts",
  "packages/notifier",
  "apps/orchestrator",
  "apps/agent_intelligence",
  "apps/agent_fundamental",
  "apps/agent_quant",
  "apps/agent_persona",
  "apps/agent_backtest",
  "apps/agent_secretary",
]
exclude = ["apps/dashboard", ".*/tests/.*"]

[[tool.mypy.overrides]]
module = [
  "nats.*",
  "chromadb.*",
  "vectorbt.*",
  "apscheduler.*",
  "feedparser",
  "alembic",
  "alembic.*",
  "minio",
  "minio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"
pythonpath = [
  "packages/data-lake",
  "packages/schema",
  "packages/llm-client",
  "packages/data-bus",
  "packages/prompts",
  "packages/notifier",
  "apps/orchestrator",
  "apps/agent_intelligence",
  "apps/agent_fundamental",
  "apps/agent_quant",
  "apps/agent_persona",
  "apps/agent_backtest",
  "apps/agent_secretary",
]
markers = [
  "integration: requires live infra (PG/NATS/Chroma/Redis); set IIC_INTEGRATION=1",
]

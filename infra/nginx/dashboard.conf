# IIC dashboard nginx config (D9 §4.2).
#
# Two jobs:
#   1. Reverse-proxy /api/* paths to the right agent container.
#      The dashboard was shipping without any proxy config, so every
#      fetch('/api/...') silently 404'd against the static-file server.
#   2. SPA fallback: any non-API path falls through to /index.html so
#      React Router can resolve sub-routes like /map on a hard refresh.
#
# Why the `resolver` + variable trick on every proxy_pass: nginx by
# default resolves upstream hostnames at config-parse time, so a stock
# `proxy_pass http://agent_intelligence:8081;` fails `nginx -t` outside
# the compose network. Using `set $up …; proxy_pass $up;` defers DNS
# resolution to request time, which docker's embedded resolver at
# 127.0.0.11 handles. Bonus: container restarts that change an agent's
# IP are picked up within `valid=10s` instead of requiring an nginx
# reload.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # docker embedded DNS — required for lazy hostname resolution below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Stop leaking the nginx version string in 404 pages (D9 §4 — the
    # "nginx/1.27" leak was the smoking gun for the original report).
    server_tokens off;

    # --- agent_intelligence (geo events + WS stream) ----------------------
    # Path-preserving: agent_intelligence registers /api/geo/events at
    # its own root, so we pass the URI through unchanged.
    location /api/geo/ {
        set $up_intel http://agent_intelligence:8081;
        proxy_pass $up_intel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/intel/ {
        set $up_intel http://agent_intelligence:8081;
        proxy_pass $up_intel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # WebSocket fanout for LiveMap streaming (D9 §5.6).
    location /api/stream/ {
        set $up_intel http://agent_intelligence:8081;
        proxy_pass $up_intel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # --- agent_secretary (chat) -------------------------------------------
    # Dashboard hits /api/chat; secretary exposes /chat at its root.
    location /api/chat {
        set $up_secretary http://agent_secretary:8086;
        proxy_pass $up_secretary/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # --- admin_api --------------------------------------------------------
    # Dashboard hits /api/admin/foo; admin_api serves at /admin/foo.
    location /api/admin/ {
        set $up_admin http://admin_api:8090;
        proxy_pass $up_admin/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- orchestrator (trading_room) --------------------------------------
    location /api/trading_room/ {
        set $up_orchestrator http://orchestrator:8080;
        proxy_pass $up_orchestrator/trading_room/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- catch-all for /api/* that we forgot to route -------------------
    # Fail loud (502) instead of silently serving the SPA index, which
    # would mask wiring gaps the way the bringup found.
    location /api/ {
        return 502 "no nginx route for $request_uri (add to infra/nginx/dashboard.conf)\n";
    }

    # --- SPA fallback (the line that fixes /map on refresh) ---------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
